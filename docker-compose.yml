services:
  # 1. Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - replybotz
    restart: unless-stopped

  # One-shot migration/seed runner. The builder image carries the Prisma CLI
  # and tsx, which the standalone production image deliberately does not.
  # Usage: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file: .env
    command: sh -c "npx prisma migrate deploy || npx prisma db push; npx tsx prisma/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    networks:
      - replybotz

  # 2. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: replybotz
      POSTGRES_USER: replybotz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replybotz -d replybotz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - replybotz
    restart: unless-stopped

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - replybotz
    restart: unless-stopped

  # 4. Meilisearch (Full-text search)
  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - meilidata:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    networks:
      - replybotz
    restart: unless-stopped

  # 5. Nginx Reverse Proxy
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - replybotz
    restart: unless-stopped

  # 6. Certbot (SSL)
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - replybotz

  # 7. Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    profiles: ["monitoring"]
    networks:
      - replybotz
    restart: unless-stopped

  # 8. Grafana (Dashboards)
  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    profiles: ["monitoring"]
    networks:
      - replybotz
    restart: unless-stopped

  # 9. Loki (Log Aggregation)
  loki:
    image: grafana/loki:2.9.0
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    profiles: ["monitoring"]
    networks:
      - replybotz
    restart: unless-stopped

  # 10. Promtail (Log Shipping)
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles: ["monitoring"]
    networks:
      - replybotz
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  meilidata:
  promdata:
  grafanadata:
  lokidata:
  certbot-webroot:
  certbot-certs:

networks:
  replybotz:
    driver: bridge
